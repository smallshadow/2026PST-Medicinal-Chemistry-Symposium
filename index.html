<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 產品展示 OLIVMEW</title>
    <style>
        body { margin: 0; background-color: #ffffff; overflow: hidden; font-family: sans-serif; }
        canvas { display: block; }
        
        #ui-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 10px;
        }
        /* 將 pauseButton 加入共用樣式中 */
        #toggleButton, #playButton, #pauseButton {
            padding: 10px 20px;
            background-color: rgba(255, 255, 255, 0.8);
            border: 1px solid #999;
            color: #333;
            cursor: pointer;
            font-size: 14px;
            letter-spacing: 1px;
            transition: all 0.3s;
            border-radius: 2px;
            white-space: nowrap;
        }
        #toggleButton:hover, #playButton:hover, #pauseButton:hover {
            background-color: #333;
            color: #fff;
        }

        #hand-hint {
            position: absolute;
            top: 50%; 
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 90;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
        }
        .hand-icon-img {
            width: 30px;
            animation: handMoveHint 2.5s infinite ease-in-out;
        }

        @keyframes handMoveHint {
            0%, 100% { transform: translateX(-30px); }
            50% { transform: translateX(30px); }
        }

        #loader {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #666; font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="loader">正在載入模型...</div>
    
    <div id="hand-hint">
        <img src="hand.png" alt="滑動提示" class="hand-icon-img">
    </div>

    <div id="ui-container">
        <button id="toggleButton">顯示尺寸標註</button>
        <button id="playButton">播放展示動畫</button>
        <!-- 新增暫停按鈕，預設隱藏 -->
        <button id="pauseButton" style="display: none;">暫停動畫</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/examples/jsm/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
        import { RGBELoader } from 'three/examples/jsm/loaders/RGBELoader.js';
        import { FontLoader } from 'three/examples/jsm/loaders/FontLoader.js';
        import { TextGeometry } from 'three/examples/jsm/geometries/TextGeometry.js';

        let scene, camera, renderer, controls, font;
        let dimensionsGroup; 
        let currentModel = null; 
        let isUserInteracting = false; 
        let dimensionTimeline = null; 

        let mixer = null;
        let clock = new THREE.Clock();
        let animationClips = [];
        let isAnimating = false; 
        let isPaused = false; // 新增：用來記錄是否正在暫停中

        init();

        function init() {
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.01, 100);
            camera.position.set(0.3, 0.09, 0.3); 

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 0.6; // 稍微提高曝光增加亮度
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            const handHint = document.getElementById('hand-hint');
            const onUserInteraction = () => {
                if (isUserInteracting) return;
                isUserInteracting = true; 
                handHint.style.opacity = '0';
                setTimeout(() => { if(handHint) handHint.remove(); }, 500);
                controls.removeEventListener('start', onUserInteraction);
            };
            controls.addEventListener('start', onUserInteraction);

            dimensionsGroup = new THREE.Group();
            dimensionsGroup.visible = false; 
            scene.add(dimensionsGroup);

            const fontLoader = new FontLoader();
            fontLoader.load('https://threejs.org/examples/fonts/helvetiker_regular.typeface.json', function (loadedFont) {
                font = loadedFont;
                loadEnvironment();
            });

            const btn = document.getElementById('toggleButton');
            const playBtn = document.getElementById('playButton');
            const pauseBtn = document.getElementById('pauseButton'); // 取得暫停按鈕

            // 暫停按鈕點擊事件
            pauseBtn.addEventListener('click', () => {
                if (!mixer || animationClips.length === 0 || !isAnimating) return;
                
                isPaused = !isPaused;
                pauseBtn.textContent = isPaused ? "繼續播放" : "暫停動畫";
                
                animationClips.forEach(clip => {
                    const action = mixer.clipAction(clip);
                    action.paused = isPaused; // 根據狀態凍結或恢復動作
                });
            });

            btn.addEventListener('click', () => {
                if (!dimensionTimeline) return;
                onUserInteraction(); 

                if (dimensionTimeline.reversed() || dimensionTimeline.paused()) {
                    if (isAnimating) {
                        isAnimating = false;
                        playBtn.textContent = "播放展示動畫";
                        
                        // 若此時正在展示動畫，切換顯示尺寸會關閉動畫，將暫停狀態一起重置並隱藏
                        isPaused = false;
                        pauseBtn.textContent = "暫停動畫";
                        pauseBtn.style.display = "none";

                        animationClips.forEach(clip => {
                            const action = mixer.clipAction(clip);
                            action.paused = false;
                            action.timeScale = -1; 
                            action.setLoop(THREE.LoopOnce);
                            action.clampWhenFinished = true;
                            action.play();
                        });
                    }
                    resetCameraView();
                    dimensionsGroup.visible = true;
                    dimensionTimeline.play();
                    btn.textContent = "隱藏尺寸標註";
                } else {
                    dimensionTimeline.reverse();
                    btn.textContent = "顯示尺寸標註";
                }
            });

            playBtn.addEventListener('click', () => {
                onUserInteraction();

                if (dimensionTimeline && !dimensionTimeline.reversed()) {
                    dimensionTimeline.reverse();
                    btn.textContent = "顯示尺寸標註";
                }

                if (!mixer || animationClips.length === 0) return;

                if (!isAnimating) {
                    isAnimating = true;
                    playBtn.textContent = "關閉展示動畫";
                    pauseBtn.style.display = "block"; // 開始播放時顯示暫停按鈕
                    
                    resetCameraView(() => {
                        animationClips.forEach(clip => {
                            const action = mixer.clipAction(clip);
                            action.paused = false;
                            action.setLoop(THREE.LoopOnce);
                            action.clampWhenFinished = true;
                            action.timeScale = 1; 
                            action.play();
                        });
                    });
                } else {
                    isAnimating = false;
                    playBtn.textContent = "播放展示動畫";
                    
                    // 關閉展示動畫時，隱藏暫停按鈕並重置狀態
                    isPaused = false;
                    pauseBtn.textContent = "暫停動畫";
                    pauseBtn.style.display = "none";

                    animationClips.forEach(clip => {
                        const action = mixer.clipAction(clip);
                        action.paused = false;
                        action.timeScale = -1; 
                        action.setLoop(THREE.LoopOnce);
                        action.clampWhenFinished = true;
                        action.play();
                    });
                }
            });

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function resetCameraView(callback) {
            if (currentModel) {
                gsap.to(currentModel.rotation, { y: 0, duration: 0.8, ease: "power2.inOut" });
            }
            gsap.to(camera.position, {
                x: 0.3, y: 0.09, z: 0.3,
                duration: 0.8,
                ease: "power2.inOut"
            });
            gsap.to(controls.target, {
                x: 0, y: 0, z: 0,
                duration: 0.8,
                ease: "power2.inOut",
                onUpdate: () => controls.update(),
                onComplete: () => {
                    if (callback) callback();
                }
            });
        }

        function loadEnvironment() {
            new RGBELoader().load('HDR.hdr', (texture) => {
                texture.mapping = THREE.EquirectangularReflectionMapping;
                scene.environment = texture; 

                const ambientLight = new THREE.AmbientLight(0xffffff, 0.4); // 降低環境光比例，讓反射更明顯
                scene.add(ambientLight);

                // 添加主點光源模擬金屬高光
                const light1 = new THREE.PointLight(0xffffff, 2);
                light1.position.set(0.5, 0.5, 0.5);
                scene.add(light1);

                const light2 = new THREE.PointLight(0xffffff, 1.5);
                light2.position.set(-0.5, 0.2, -0.5);
                scene.add(light2);

                const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.0);
                scene.add(hemiLight);

                loadModel();
            }, undefined, () => {
                scene.add(new THREE.AmbientLight(0xffffff, 1));
                loadModel();
            });
        }

        function createFlatText(text, x, y, z) {
            if (!font) return null;
            const textGeo = new TextGeometry(text, {
                font: font,
                size: 0.005,        
                height: 0.0001,     
                curveSegments: 4,
                bevelEnabled: false
            });
            textGeo.computeBoundingBox();
            const centerOffset = -0.5 * (textGeo.boundingBox.max.x - textGeo.boundingBox.min.x);
            textGeo.translate(centerOffset, 0, 0);

            const textMaterial = new THREE.MeshBasicMaterial({ 
                color: 0x999999, 
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0 
            });
            const textMesh = new THREE.Mesh(textGeo, textMaterial);
            textMesh.position.set(x, y, z);
            
            textMesh.onBeforeRender = function( renderer, scene, camera ) {
                this.quaternion.copy( camera.quaternion );
            };

            return textMesh;
        }

        function createThickLine(start, end, thickness) {
            const distance = start.distanceTo(end);
            const geometry = new THREE.CylinderGeometry(thickness, thickness, distance, 6);
            geometry.translate(0, distance / 2, 0);
            const material = new THREE.MeshBasicMaterial({ color: 0x999999 });
            const cylinder = new THREE.Mesh(geometry, material);
            cylinder.position.copy(start);
            cylinder.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), end.clone().sub(start).normalize());
            cylinder.scale.y = 0;
            return cylinder;
        }

        function createDimensionGroup(points, thickness) {
            const group = new THREE.Group();
            for (let i = 0; i < points.length - 1; i++) {
                group.add(createThickLine(points[i], points[i+1], thickness));
            }
            return group;
        }

        function setupDimensionTimeline() {
            dimensionTimeline = gsap.timeline({ 
                paused: true, 
                reversed: true,
                onReverseComplete: () => { dimensionsGroup.visible = false; } 
            });

            dimensionsGroup.children.forEach(child => {
                if (child instanceof THREE.Group) {
                    dimensionTimeline.to(child.children.map(line => line.scale), {
                        y: 1,
                        duration: 0.3,
                        stagger: 0.05,
                        ease: "power2.inOut"
                    });
                } else if (child instanceof THREE.Mesh) {
                    dimensionTimeline.to(child.material, {
                        opacity: 1,
                        duration: 0.3
                    }, "-=0.15");
                }
            });
        }

        function loadModel() {
            const loader = new GLTFLoader();
            loader.load('bd03.glb', function (gltf) {
                currentModel = gltf.scene; 
                
                currentModel.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                        if (child.material) {
                            if (child.material.aoMap) {
                            child.material.aoMapIntensity = 0.6; // 讓陰影淺一點，不要全黑
                            }
                            // 金屬感核心參數改動
                            child.material.metalness = 1.0;          // 完全金屬
                            child.material.roughness = 0.15;         // 降低粗糙度，反射更銳利
                            child.material.envMapIntensity = 2.1;    // 增強對環境(HDR)的反射強度
                            child.material.emissive = new THREE.Color(0x000000); // 移除發光，改由反射表現質感
                            child.material.needsUpdate = true;
                        }
                    }
                });

                if (gltf.animations && gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(currentModel);
                    animationClips = gltf.animations;
                }

                const box = new THREE.Box3().setFromObject(currentModel);
                const size = box.getSize(new THREE.Vector3());
                const center = box.getCenter(new THREE.Vector3());
                currentModel.position.sub(center); 
                scene.add(currentModel);

                document.getElementById('hand-hint').style.opacity = '0.8';

                const margin = 0.01, lineExtension = 0.001, textOffset = 0.015, zOffsetDown = 0.015, yAxisZShift = -0.02, lineThickness = 0.00025; 

                const yPoints = [
                    new THREE.Vector3(size.x/2 + lineExtension, size.y/2, yAxisZShift),
                    new THREE.Vector3(size.x/2 + margin, size.y/2, yAxisZShift),
                    new THREE.Vector3(size.x/2 + margin, -size.y/2, yAxisZShift),
                    new THREE.Vector3(size.x/2 + lineExtension, -size.y/2, yAxisZShift)
                ];
                dimensionsGroup.add(createDimensionGroup(yPoints, lineThickness));

                const hVal = (size.y * 100).toFixed(0) + " mm";
                const hLabel = createFlatText(hVal, size.x/2 + margin + textOffset, 0, yAxisZShift);
                dimensionsGroup.add(hLabel);

                const zPoints = [
                    new THREE.Vector3(size.x/2 + lineExtension, -size.y/2 - zOffsetDown, size.z/2),
                    new THREE.Vector3(size.x/2 + margin, -size.y/2 - zOffsetDown, size.z/2),
                    new THREE.Vector3(size.x/2 + margin, -size.y/2 - zOffsetDown, -size.z/2),
                    new THREE.Vector3(size.x/2 + lineExtension, -size.y/2 - zOffsetDown, -size.z/2)
                ];
                dimensionsGroup.add(createDimensionGroup(zPoints, lineThickness));

                const dVal = (size.z * 100).toFixed(0) + " 2mm";
                const dLabel = createFlatText(dVal, size.x/2 + margin + textOffset, -size.y/2 - zOffsetDown, 0);
                dimensionsGroup.add(dLabel);

                setupDimensionTimeline();

                controls.target.set(0, 0, 0);
                document.getElementById('loader').style.display = 'none';
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);
            controls.update();
            if (currentModel && !isUserInteracting) {
                const time = Date.now() * 0.001; 
                const shakeAmplitude = 0.05; 
                const shakeSpeed = 2.5; 
                currentModel.rotation.y = Math.sin(time * shakeSpeed) * shakeAmplitude;
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
